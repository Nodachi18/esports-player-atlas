<!doctype html>
<!--
  THROWAWAY PROTOTYPE — .scratch/admin-player-crud/issues/01-admin-page-layout.md

  Three layouts for the admin page once a player form lives in it, switchable with
  ?variant=. Fixture data, no API calls, no mutations. Delete this directory before
  anything merges to main: public/ is served to the live public site, so a prototype
  left here ships.

  Run: docker compose up, then http://localhost:8787/prototype/admin-layout.html
  (Wrangler builds its asset manifest at startup — a new directory under public/ 404s
  until `docker compose restart atlas`.)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — admin page layout</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="stylesheet" href="/app/fonts.css">
<link rel="stylesheet" href="/app/styles.css">
<style>
/* Prototype-only CSS. Everything is .pt-*, so nothing here can leak into the real
   stylesheet's namespace when this file is deleted. */

:root {
  /* A third colour, deliberately neither tint. --role says who you are, --lens says
     which panel you are reading; an irreversible destruction is neither, and painting
     it admin-amber is exactly the collapse the handoff warns about. #ff7a7a is already
     in styles.css as .result.bad. */
  --danger: #ff7a7a;
  --danger-sunk: #1d0f12;
}

/* ---------- prototype chrome ---------- */

.pt-banner {
  background: #2a1d05;
  border-bottom: 1px solid var(--admin);
  color: #ffd9a3;
  padding: 7px 26px;
  font: 500 12px/1.5 var(--sans);
}
.pt-banner b { color: var(--admin); }

/* The switcher floats over the bottom of the page; keep it off the last control. */
main.wrap { padding-bottom: 96px; }

.pt-frame { border-top: 1px solid var(--line-dim); }
.pt-frame:first-of-type { border-top: 0; }
.pt-caption {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 26px 0 14px;
}
.pt-caption b { font: 700 24px var(--cond); letter-spacing: .04em; }
.pt-caption span { font-size: 12px; color: var(--mute); }

.pt-switch {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 50;
  display: flex; align-items: center; gap: 6px;
  background: #e9f3fa; color: #06121b;
  border-radius: 999px;
  padding: 6px 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.55);
  font: 600 13px var(--sans);
}
.pt-switch button {
  background: none; border: 0; border-radius: 999px;
  color: #06121b; cursor: pointer;
  padding: 6px 11px;
  font: 600 13px var(--sans);
}
.pt-switch button:hover { background: rgba(6,18,27,.09); }
.pt-switch button[data-on] { background: #06121b; color: #e9f3fa; }
.pt-switch .pt-name { padding: 0 6px; min-width: 150px; text-align: center; white-space: nowrap; }
.pt-switch .pt-rule { width: 1px; height: 20px; background: rgba(6,18,27,.18); margin: 0 3px; }

/* ---------- shared form atoms ---------- */

.pt-f { display: block; }
.pt-fl {
  display: block;
  font: 600 11px var(--sans); letter-spacing: .1em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 5px;
}
.pt-f input, .pt-f textarea, .pt-f select {
  width: 100%;
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--ink);
  padding: 9px 12px;
  font: 400 15px var(--sans);
}
.pt-f textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
.pt-f input:focus, .pt-f textarea:focus { border-color: var(--role); outline: none; }
[hidden] { display: none !important; }
.pt-hint { display: block; font-size: 11px; line-height: 1.5; color: var(--mute); margin: 5px 0 0; max-width: 56ch; }
.pt-hint.warn { color: var(--admin); }

.pt-read { align-self: start; }
.pt-read p {
  margin: 0;
  padding: 9px 0 0;
  font-size: 14px;
  color: var(--mute);
}
.pt-read .pt-num { font: 700 21px var(--cond); color: var(--lens); }

.pt-slug {
  font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 4px 8px;
  color: var(--mute);
  background: var(--sunk);
}
.pt-slug b { color: var(--ink); font-weight: 500; }

.pt-save {
  background: var(--role); color: var(--void); border: 0; border-radius: 3px;
  padding: 11px 22px; font: 700 15px var(--cond); letter-spacing: .06em; cursor: pointer;
}
.pt-ghost {
  background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 3px;
  padding: 10px 16px; font: 600 14px var(--cond); letter-spacing: .05em; cursor: pointer;
}
.pt-ghost:hover { border-color: var(--role); }
.pt-del {
  background: none; border: 1px solid var(--danger); color: var(--danger);
  border-radius: 3px; padding: 10px 16px;
  font: 600 14px var(--cond); letter-spacing: .05em; cursor: pointer;
}
.pt-del:hover { background: var(--danger); color: var(--void); }
.pt-del[disabled] { opacity: .35; cursor: not-allowed; background: none; color: var(--danger); }

.pt-mode {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.pt-mode h1 { font: 700 42px/1 var(--cond); letter-spacing: .01em; }
.pt-tag {
  font: 700 11px var(--sans); letter-spacing: .14em; text-transform: uppercase;
  border-radius: 2px; padding: 4px 8px;
}
.pt-tag.edit { background: var(--admin); color: var(--void); }
.pt-tag.create { border: 1px dashed var(--admin); color: var(--admin); }

/* ---------- the guard, shared by all three variants ---------- */

.pt-guard { border: 1px solid var(--danger); border-radius: 4px; background: var(--danger-sunk); }
.pt-guard h2 { font: 700 26px var(--cond); letter-spacing: .02em; color: var(--ink); }
.pt-guard p { font-size: 14px; line-height: 1.6; margin: 10px 0 0; color: #f0d6d8; }
.pt-guard .pt-count { color: var(--danger); font-weight: 700; }
.pt-guard .pt-body { padding: 20px 22px; }
.pt-guard .pt-type { margin-top: 16px; display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.pt-guard .pt-type .pt-f { flex: 1 1 210px; }
.pt-guard .pt-type input { background: #140b0d; border-color: #5d2b31; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.pt-guard .pt-type input:focus { border-color: var(--danger); }
.pt-guard .pt-acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

dialog.pt-guard {
  width: min(520px, calc(100vw - 32px));
  padding: 0;
  color: var(--ink);
}
dialog.pt-guard::backdrop { background: rgba(2,7,11,.78); }
dialog.pt-inflow[open] { position: static; margin: 20px 0 0; }
/* Three stacked frames cannot each have a sticky bar. */
.pt-tiled .pt-bar { position: static; }

/* ---------- A: roster rail ---------- */

.pt-a { display: grid; grid-template-columns: 262px minmax(0, 1fr); gap: 20px; align-items: start; }

.pt-rail { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
.pt-railhead {
  display: flex; align-items: baseline; gap: 10px;
  padding: 12px 14px 10px;
}
.pt-railhead h2 { font: 600 12px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--mute); }
.pt-railhead .count { margin-left: auto; }
.pt-railnew {
  display: block; width: calc(100% - 20px); margin: 0 10px 8px;
  background: none; border: 1px dashed var(--admin); border-radius: 3px;
  color: var(--admin); padding: 9px; cursor: pointer;
  font: 600 15px var(--cond); letter-spacing: .06em;
}
.pt-railnew:hover { background: rgba(255,178,89,.1); }
.pt-railnew[data-on] { background: var(--admin); color: var(--void); border-style: solid; }
.pt-railhint { font-size: 11px; color: var(--mute); padding: 0 14px 10px; margin: 0; }
.pt-raillist { list-style: none; margin: 0; padding: 0; max-height: 540px; overflow-y: auto; border-top: 1px solid var(--line-dim); }
.pt-raillist button {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 10px;
  width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--line-dim);
  color: inherit; padding: 9px 14px; cursor: pointer;
}
.pt-raillist button:hover { background: var(--sunk); }
.pt-raillist button[aria-current] { background: var(--sunk); box-shadow: inset 3px 0 0 var(--admin); }
.pt-raillist .n { font: 600 17px var(--cond); letter-spacing: .03em; }
.pt-raillist .r { font-size: 11px; color: var(--lens); }
.pt-raillist .r.zero { color: var(--mute); }
.pt-raillist .s { grid-column: 1 / -1; font-size: 11px; color: var(--mute); }
.pt-railempty { padding: 16px 14px; font-size: 13px; color: var(--mute); }

.pt-work { min-width: 0; }
.pt-set { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 16px 18px; margin: 16px 0 0; }
.pt-set legend {
  font: 600 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--mute);
  padding: 0 6px;
}
.pt-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.pt-grid2 .wide { grid-column: 1 / -1; }
.pt-actions {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-dim);
}
.pt-actions .pt-del { margin-left: auto; }

/* .result is the app's own banner (styles.css). Each variant only decides where it goes. */
.pt-bar .result { margin: 0; flex: 1 1 100%; }
.pt-actions + .result, .pt-drawerbody .result { margin-top: 14px; }

.pt-totals {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line-dim);
  font-size: 12px; color: var(--mute);
}
.pt-totals b { font: 700 17px var(--cond); color: var(--ink); }
.pt-totals a { color: var(--role); border-bottom: 1px solid var(--line); }

details.pt-sub { margin-top: 16px; }
details.pt-sub summary { font-size: 13px; color: var(--mute); cursor: pointer; }

/* ---------- B: one column, actions in a sticky bar ---------- */

.pt-b { max-width: 720px; }
.pt-bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 4px solid var(--admin);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 20px;
}
.pt-bar.create { border-left-style: dashed; }
.pt-bar b { font: 700 27px/1 var(--cond); letter-spacing: .02em; }
.pt-bar .pt-sp { margin-left: auto; }

.pt-col { display: grid; gap: 16px; }
.pt-drop {
  border: 1px solid var(--role);
  border-radius: 4px;
  background: var(--panel);
  box-shadow: 0 16px 40px rgba(0,0,0,.5);
  overflow: hidden;
  margin-bottom: 18px;
}
.pt-drop .pt-dh {
  padding: 8px 13px; border-bottom: 1px solid var(--line-dim);
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--mute);
}
.pt-drop button {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line-dim);
  color: inherit; padding: 9px 13px; cursor: pointer;
}
.pt-drop button:hover { background: var(--sunk); }
.pt-drop button:last-child { border-bottom: 0; }
.pt-drop .n { font: 600 17px var(--cond); letter-spacing: .03em; }
.pt-drop .s { font-size: 11px; color: var(--mute); }
.pt-drop .r { margin-left: auto; font-size: 11px; color: var(--lens); }

.pt-zone {
  margin-top: 26px;
  border: 1px solid #4a2228;
  border-radius: 4px;
  padding: 18px 20px;
}
.pt-zone h2 { font: 700 21px var(--cond); letter-spacing: .03em; color: var(--danger); }
.pt-zone p { font-size: 13px; color: var(--mute); line-height: 1.6; margin: 8px 0 14px; max-width: 58ch; }

.pt-ovr { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line-dim); }
.pt-ovr h2 { font: 600 12px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--mute); margin-bottom: 12px; }

/* ---------- C: tabs, and the form opens inside the row ---------- */

.pt-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.pt-tabs button {
  background: none; border: 1px solid transparent; border-bottom: 0;
  color: var(--mute); cursor: pointer;
  padding: 11px 18px;
  font: 600 18px var(--cond); letter-spacing: .05em;
}
.pt-tabs button:hover { color: var(--ink); }
.pt-tabs button[aria-selected='true'] {
  background: var(--panel);
  border-color: var(--line);
  color: var(--ink);
  box-shadow: inset 0 2px 0 var(--admin);
  margin-bottom: -1px;
  border-radius: 3px 3px 0 0;
}

.pt-rowhead, .pt-rowbtn {
  display: grid;
  grid-template-columns: minmax(110px, 1.1fr) minmax(110px, 1.2fr) 86px minmax(110px, 1.5fr) 76px;
  align-items: baseline; gap: 10px;
  padding: 9px 10px;
}
.pt-rowhead {
  border-bottom: 1px solid var(--line);
  font: 600 11px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--mute);
}
.pt-rowhead span:last-child { text-align: right; }
.pt-rowbtn {
  width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--line-dim); color: inherit; cursor: pointer;
}
.pt-rowbtn:hover { background: var(--panel); }
.pt-row[data-open] .pt-rowbtn { background: var(--sunk); box-shadow: inset 3px 0 0 var(--admin); }
.pt-roster .n { font: 600 18px var(--cond); letter-spacing: .03em; }
.pt-roster .d { font-size: 13px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-roster .d.empty { color: var(--line); }
.pt-roster .r { font: 700 16px var(--cond); color: var(--lens); text-align: right; }
.pt-roster .r.zero { color: var(--mute); }
.pt-drawer {
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  box-shadow: inset 3px 0 0 var(--admin);
}
.pt-drawerbody { padding: 18px 20px 20px; }
.pt-drawerbody .pt-mode { margin-bottom: 14px; }
/* A guard as wide as the page is a banner. Keep it the size of a decision. */
.pt-drawerbody .pt-guard, .pt-zone .pt-guard { max-width: 600px; }
.pt-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pt-grid3 .wide { grid-column: 1 / -1; }
.pt-newcard {
  border: 1px dashed var(--admin); border-radius: 4px; background: var(--panel);
  padding: 20px 22px;
}
.pt-stub {
  margin-top: 20px; border: 1px dashed var(--line); border-radius: 4px;
  padding: 16px 18px; font-size: 13px; color: var(--mute);
}
.pt-stub b { display: block; font: 600 18px var(--cond); letter-spacing: .04em; color: var(--ink); margin-bottom: 4px; }

@media (max-width: 1000px) {
  .pt-a { grid-template-columns: 1fr; }
  .pt-raillist { max-height: 260px; }
  .pt-grid3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
  .pt-grid2, .pt-grid3 { grid-template-columns: 1fr; }
  .pt-switch { bottom: 8px; flex-wrap: wrap; max-width: calc(100vw - 16px); justify-content: center; }
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/prototype/admin-layout.js"></script>
</body>
</html>
